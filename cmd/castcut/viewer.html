<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>castcut annotate</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css"
      integrity="sha384-05cmIVRzN7mR7nmqajPpGPUPqJ5VyTAGHL1xJuiGWfhpWDp5hEfBk50kr21f3ILM" crossorigin="anonymous">
<style>
  :root { --bg: #16181d; --fg: #d8dbe2; --muted: #8a90a0; --panel: #1f232b; --accent: #7aa2f7; --warn: #e0af68; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); }
  header .time { font: 600 20px ui-monospace, monospace; color: var(--accent); min-width: 110px; }
  .hint { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  /* The player fits the window so nothing falls below the fold. placeCaption() pins the
     caption to the terminal's bottom-left, the same box CastEmbed.astro uses. */
  .stage { position: relative; height: calc(100vh - 84px); min-height: 320px; }
  #player { height: 100%; }
  #caption { position: absolute; z-index: 10; padding: 0.35em 0.7em; border-radius: 10px;
             pointer-events: none; background: rgba(0, 0, 0, 0.85); color: #fff;
             font: 600 22px/1.25 system-ui, sans-serif; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); }
  #caption:empty { display: none; }
  aside { display: flex; flex-direction: column; gap: 8px; }
  textarea { flex: 1; min-height: 360px; width: 100%; background: var(--panel); color: var(--fg);
             border: 1px solid #333a46; padding: 8px; font: 13px/1.5 ui-monospace, monospace; resize: vertical; }
  button { background: #2a303b; color: var(--fg); border: 1px solid #3a4250; padding: 5px 10px;
           border-radius: 4px; cursor: pointer; font: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #save-status.warn, #load-status { color: var(--warn); }
</style>
</head>
<body>
<header>
  <span class="time" id="time">0:00.0</span>
  <label><input type="checkbox" id="pauseOnMarkers"> pause at captions</label>
  <span class="hint" id="src"></span>
  <span id="load-status" role="status"></span>
  <span class="hint">space pause · ←/→ seek · . step frame (paused) · [ ] prev/next caption</span>
</header>
<main>
  <section class="stage">
    <div id="player"></div>
    <div id="caption"></div>
  </section>
  <aside>
    <div class="row">
      <button id="stamp" title="Alt+T">Insert time (Alt+T)</button>
      <button id="download">Download notes</button>
    </div>
    <textarea id="notes" disabled spellcheck="true" placeholder="~0:05  The app installs its plugins on first launch.&#10;~0:42  Branch off to ask a side question."></textarea>
    <span class="hint">Alt+T pauses and adds a ~m:ss.s line. Notes save to <span id="notes-name"></span> beside the take as you type; castcut cut reads that file.</span>
    <span id="save-status" role="status"></span>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.min.js"
        integrity="sha384-s55nTYAdrPwGWmKKQ1lCnoB8H9LbqmsXsqqqPAHK2+T5h9IfI2dTXTDXJcZnySJD" crossorigin="anonymous"></script>
<script>
  const $ = id => document.getElementById(id);
  let player = null;
  let castData = null;
  let captions = null; // [{start, end, text}] from a cut cast's header

  const fmt = t => {
    const m = Math.floor(t / 60), s = t - m * 60;
    return `${m}:${s.toFixed(1).padStart(4, '0')}`;
  };

  function readCaptions(data) {
    try {
      const header = JSON.parse(data.slice(0, data.indexOf('\n')));
      return Array.isArray(header.captions) ? header.captions : null;
    } catch { return null; }
  }

  function load() {
    captions = readCaptions(castData);
    $('caption').textContent = '';
    if (player) player.dispose();
    $('player').replaceChildren();
    player = AsciinemaPlayer.create({ data: castData }, $('player'), {
      fit: 'both',
      pauseOnMarkers: $('pauseOnMarkers').checked,
    });
    // Header captions carry their own end time; bare markers show until the next one.
    player.addEventListener('marker', ({ label }) => { if (!captions) $('caption').textContent = label || ''; });
    player.addEventListener('seeked', () => { if (!captions) $('caption').textContent = ''; });
  }

  async function currentTime() {
    if (!player) return 0;
    const t = await Promise.resolve(player.getCurrentTime());
    return typeof t === 'number' ? t : 0;
  }

  // Caption box in terminal fractions: left edge, max width, bottom edge.
  const CAPTION_BOX = { left: 0.02, width: 0.5, bottom: 0.935 };

  function placeCaption() {
    const term = $('player').querySelector('.ap-term');
    if (!term) return;
    const t = term.getBoundingClientRect(), stage = $('player').parentElement.getBoundingClientRect();
    const c = $('caption').style;
    c.left = `${t.left - stage.left + t.width * CAPTION_BOX.left}px`;
    c.maxWidth = `${t.width * CAPTION_BOX.width}px`;
    c.bottom = `${stage.bottom - (t.top + t.height * CAPTION_BOX.bottom)}px`;
    c.fontSize = `${Math.max(16, t.width * 0.032)}px`;
  }

  setInterval(async () => {
    placeCaption();
    const t = await currentTime();
    $('time').textContent = fmt(t);
    if (captions) {
      const c = captions.find(c => c.start <= t && t < c.end);
      $('caption').textContent = c ? c.text : '';
    }
  }, 100);

  $('pauseOnMarkers').addEventListener('change', () => { if (castData) load(); });

  // Notes persist to the sidecar file through the server. At most one PUT is in
  // flight; edits made meanwhile are sent when it returns, so the latest text wins.
  let saving = false, dirty = false, timer = 0;
  function scheduleSave() {
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(save, 500);
  }
  async function save() {
    if (saving || !dirty) return;
    saving = true;
    dirty = false;
    const text = $('notes').value;
    try {
      const r = await fetch('/notes', { method: 'PUT', body: text });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      $('save-status').textContent = 'Saved to ' + $('notes-name').textContent;
      $('save-status').className = '';
    } catch (e) {
      dirty = true;
      $('save-status').textContent = `Unsaved: ${e.message} — download notes to keep them.`;
      $('save-status').className = 'warn';
    } finally {
      saving = false;
      if (dirty) timer = setTimeout(save, 2000);
    }
  }
  $('notes').addEventListener('input', scheduleSave);
  window.addEventListener('beforeunload', e => { if (dirty || saving) e.preventDefault(); });

  async function stamp() {
    if (player) await Promise.resolve(player.pause());
    const ta = $('notes');
    const line = `~${fmt(await currentTime())}  `;
    const pos = ta.selectionStart ?? ta.value.length;
    const before = ta.value.slice(0, pos);
    const prefix = before && !before.endsWith('\n') ? '\n' : '';
    ta.value = before + prefix + line + ta.value.slice(pos);
    const caret = (before + prefix + line).length;
    ta.focus();
    ta.setSelectionRange(caret, caret);
    ta.dispatchEvent(new Event('input'));
  }
  $('stamp').addEventListener('click', stamp);
  document.addEventListener('keydown', e => {
    if (e.altKey && (e.key === 't' || e.code === 'KeyT')) { e.preventDefault(); stamp(); }
  });

  $('download').addEventListener('click', () => {
    const blob = new Blob([$('notes').value], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = $('notes-name').textContent || 'captions.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  (async () => {
    try {
      const get = async path => {
        const r = await fetch(path);
        if (!r.ok) throw new Error(`${path}: ${r.status}`);
        return r;
      };
      const session = await (await get('/session')).json();
      $('src').textContent = session.cast;
      $('notes-name').textContent = session.notes;
      document.title = session.cast + ' — castcut annotate';
      // Editing starts only once the saved notes are in: a failed read must
      // never become an empty draft that autosave writes back over them.
      $('notes').value = await (await get('/notes')).text();
      $('notes').disabled = false;
      castData = await (await get('/cast')).text();
      load();
    } catch (e) {
      $('load-status').textContent = 'Could not load: ' + e.message + ' (is castcut annotate still running?)';
    }
  })();
</script>
</body>
</html>
